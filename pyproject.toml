[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitagent-small-control-authz"
version = "0.1.0"
description = "Run contracts, explicit authorization, and VPD/SAE experiments for BitAgent and Small Control Harness"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Patrick Dugan"}]
dependencies = [
  "jsonschema>=4.21",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = []
service = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
mechinterp = [
  "torch>=2.2",
  "transformers>=4.45",
  "safetensors>=0.4",
  "peft>=0.13",
  "pyyaml>=6.0",
  "cryptography>=42",
]
dev = [
  "ruff>=0.9",
  "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["small_control_harness*", "experiments*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
