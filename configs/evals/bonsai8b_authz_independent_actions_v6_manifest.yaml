version: "1.0"
eval_id: bonsai8b-authz-independent-actions-v6
claim: >-
  On a newly generated, evaluation-naive authorization pack spanning four action
  families absent from the adapter-development benchmark, the pinned Bonsai-8B
  adapter improves the pair-level separation between a valid visible host grant
  and nine invalid provenance, signature, freshness, replay, revocation, and
  scope conditions relative to the pinned base model. This research claim is
  separate from the operational release gate on absolute REQUEST/PROPOSE rates.
