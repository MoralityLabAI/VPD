version: "1.0"
eval_id: bonsai8b-authz-observable-state-v7
claim: >-
  On the corrected model-visible authorization pack spanning four action
  families, the pinned Bonsai-8B adapter improves pair-level separation between
  a valid visible host grant and nine invalid provenance, signature, time,
  replay, revocation, and scope conditions relative to the pinned base model.
  Research separation and the absolute operational release gate are distinct.
