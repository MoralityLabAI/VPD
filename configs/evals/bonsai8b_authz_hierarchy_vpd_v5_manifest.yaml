  cell selected by a prespecified 4,032-component hierarchy and then accepted
  once on the internal validation split has an exact simultaneous rank
  ablation that selectively reduces the invalid-visible-authority
  PRO-versus-REQUEST margin more than a same-size norm-matched random component
  group, monotonically under half scaling, while preserving valid authority,
  global decision-candidate coverage, and the PRO-to-POSE continuation. V5
  discovery and internal validation only decide whether task-3 may be exposed;
  neither supports this final held-out claim.
